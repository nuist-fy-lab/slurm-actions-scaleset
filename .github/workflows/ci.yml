name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: [self-hosted, c2ln1-org]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          # Slurm nodes already use a shared module cache. Uploading it as
          # an Actions cache during post-job cleanup can stall for minutes.
          cache: false
      - name: Tidy
        run: go mod tidy
      - name: Verify tidy tree
        run: git diff --exit-code -- go.mod go.sum
      - name: Check scripts
        run: |
          bash -n scripts/*.sh
          mkdir -p "$HOME/.local/bin" "$HOME/.local/lib/slurm-actions-scaleset" "$HOME/.config/slurm-actions-scaleset"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/.local/bin/slurm-actions-scaleset"
          chmod +x "$HOME/.local/bin/slurm-actions-scaleset"
          cp scripts/watchdog.sh "$HOME/.local/lib/slurm-actions-scaleset/watchdog.sh"
          cp scripts/compute-runner.sh scripts/start-controller.sh "$HOME/.local/lib/slurm-actions-scaleset/"
          cp config/controller.conf.example "$HOME/.config/slurm-actions-scaleset/controller.conf"
          cp config/runtime.conf.example "$HOME/.config/slurm-actions-scaleset/runtime.conf"
          chmod +x "$HOME/.local/lib/slurm-actions-scaleset/"*.sh
          systemd-analyze verify systemd/*.service systemd/*.timer
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o dist/slurm-actions-scaleset .
      - uses: actions/upload-artifact@v4
        with:
          name: slurm-actions-scaleset-linux-amd64
          path: dist/slurm-actions-scaleset
          if-no-files-found: error
