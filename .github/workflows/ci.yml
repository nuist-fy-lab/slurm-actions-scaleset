name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  test-build:
    # Public repository: run trusted org-repository pushes on GitHub-hosted CI.
    # Do not enable PR events; untrusted forks must not trigger this workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          # Keep builds self-contained and avoid uploading any shared cache.
          cache: false
      - name: Tidy
        run: go mod tidy
      - name: Verify tidy tree
        run: git diff --exit-code -- go.mod go.sum
      - name: Check scripts
        run: |
          bash -n scripts/*.sh
          # Validate service files on the isolated GitHub-hosted runner.
          systemd-analyze verify systemd/*.service systemd/*.timer
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o dist/slurm-actions-scaleset .
      - uses: actions/upload-artifact@v4
        with:
          name: slurm-actions-scaleset-linux-amd64
          path: dist/slurm-actions-scaleset
          if-no-files-found: error
