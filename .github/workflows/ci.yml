name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  test-build:
    # Public repository: run trusted org-repository pushes on GitHub-hosted CI.
    # Do not enable PR events; untrusted forks must not trigger this workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          # Keep builds self-contained and avoid uploading any shared cache.
          cache: false
      - name: Tidy
        run: go mod tidy
      - name: Verify tidy tree
        run: git diff --exit-code -- go.mod go.sum
      - name: Check scripts
        run: |
          bash -n scripts/*.sh
          # systemd-analyze expands %h to the CI user's HOME: stage the
          # referenced executable scripts before validating unit files.
          install -D -m 755 scripts/start-controller.sh "$HOME/.local/lib/slurm-actions-scaleset/start-controller.sh"
          install -D -m 755 scripts/watchdog.sh "$HOME/.local/lib/slurm-actions-scaleset/watchdog.sh"
          systemd-analyze verify systemd/*.service systemd/*.timer
      - name: Verify persistent pool reuse
        run: bash scripts/test-pool-worker.sh
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o dist/slurm-actions-scaleset .
      - name: Build Go Tailscale bridge for c2ln1 and NanoPi
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w" \
            -o dist/nsmc-ts-bridge-linux-amd64 ./cmd/nsmc-ts-bridge
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" \
            -o dist/nsmc-ts-bridge-linux-arm64 ./cmd/nsmc-ts-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: nsmc-ts-bridge-linux-amd64
          path: dist/nsmc-ts-bridge-linux-amd64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nsmc-ts-bridge-linux-arm64
          path: dist/nsmc-ts-bridge-linux-arm64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: slurm-actions-scaleset-linux-amd64
          path: dist/slurm-actions-scaleset
          if-no-files-found: error
