name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Tidy
        run: go mod tidy
      - name: Verify tidy tree
        run: git diff --exit-code -- go.mod go.sum
      - name: Check scripts
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/http-connect-via-socks.py
          mkdir -p "$HOME/.local/bin" "$HOME/.local/lib/slurm-actions-scaleset"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/.local/bin/github-egress-run"
          chmod +x "$HOME/.local/bin/github-egress-run"
          cp scripts/watchdog.sh "$HOME/.local/lib/slurm-actions-scaleset/watchdog.sh"
          chmod +x "$HOME/.local/lib/slurm-actions-scaleset/watchdog.sh"
          systemd-analyze verify systemd/*.service systemd/*.timer
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate runtime scripts
        run: |
          bash -n scripts/compute-runner.sh scripts/watchdog.sh
          python3 -m py_compile scripts/http-connect-via-socks.py
      - name: Build Linux amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o dist/slurm-actions-scaleset .
      - uses: actions/upload-artifact@v4
        with:
          name: slurm-actions-scaleset-linux-amd64
          path: dist/slurm-actions-scaleset
          if-no-files-found: error
