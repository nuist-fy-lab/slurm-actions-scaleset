name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
      - name: Tidy
        run: go mod tidy
      - name: Verify tidy tree
        run: git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o dist/slurm-actions-scaleset .
      - uses: actions/upload-artifact@v4
        with:
          name: slurm-actions-scaleset-linux-amd64
          path: dist/slurm-actions-scaleset
          if-no-files-found: error
