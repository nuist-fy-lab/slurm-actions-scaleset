name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  test-build:
    # Only organization repository pushes can run on c2ln1. In particular,
    # never enable pull_request or pull_request_target on this public repo:
    # fork authors could otherwise alter the workflow before CI runs.
    runs-on: [self-hosted, c2ln1-org]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          # Slurm nodes already use a shared module cache. Uploading it as
          # an Actions cache during post-job cleanup can stall for minutes.
          cache: false
      - name: Tidy
        run: go mod tidy
      - name: Verify tidy tree
        run: git diff --exit-code -- go.mod go.sum
      - name: Check scripts
        run: |
          bash -n scripts/*.sh
          # Compute runners share $HOME with the production controller.
          # NEVER install or overwrite anything in $HOME during CI.
          systemd-analyze verify systemd/*.service systemd/*.timer
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux amd64
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o dist/slurm-actions-scaleset .
      - uses: actions/upload-artifact@v4
        with:
          name: slurm-actions-scaleset-linux-amd64
          path: dist/slurm-actions-scaleset
          if-no-files-found: error
